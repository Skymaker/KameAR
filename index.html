/* ==========================================================================
 * physics — robot articulado en Rapier
 *
 * Trece sólidos rígidos: el cuerpo y, por pata, el soporte, la pata y el pie
 * (unido por un paralelogramo real). Ocho
 * articulaciones de revolución con motor de posición, una por servo, que
 * siguen los ángulos de las marchas. El robot se desplaza por la fricción de
 * sus pies con el suelo.
 *
 * - Unidades: longitudes ×10 respecto a metros (1 unidad = 10 cm), masa en kg.
 *   Rapier es más estable con objetos de tamaño próximo a la unidad.
 * - Ejes: los de Three.js (Y arriba). Un punto del ensamblaje (mm, Z arriba)
 *   pasa a (x, z, -y) / 100.
 * - El pie no gira al moverse la pata (paralelogramo): su colisionador va en
 *   el sólido de la pata y se contragira en cada paso.
 * - La pata no choca con su propio cuerpo: de eso se ocupan los topes de las
 *   articulaciones (SERVO_LIMITS). Sí chocan las patas entre sí y con el entorno.
 * ========================================================================== */

const PHYS = {
  scale: 10,               // unidades de física por metro
  dt: 1 / 240,             // paso fijo (s)
  iterations: 12,          // iteraciones del resolvedor por paso
  hullDirections: 40,      // vértices máximos de cada colisionador convexo
  gravity: 9.81,           // m/s²
  servoSpeed: 600,         // °/s, velocidad máxima de un SG90 (0,1 s / 60°)
  stiffness: 400,          // rigidez del servo: da su par máximo con unos 2,5° de error
  damping: 2,              // amortiguación del servo (con el par máximo, limita su velocidad a ~500 °/s)
  stallTorque: 17.6,       // par máximo del servo: 1,8 kg·cm = 0,176 N·m (×100 en unidades de física)
  friction: { foot: 0.9, other: 0.5, ground: 0.9 },
  mass: { body: 0.150, bracket: 0.020, leg: 0.008, foot: 0.007 }, // kg (soporte incluye su servo)
  bodyCom: [0, -10, 8],    // centro de masas del cuerpo (mm): estimado, algo bajo y adelantado para que el salto caiga de pie
  startHeight: 20.5,       // mm del origen del cuerpo sobre el suelo en la postura de calibración
};

const GROUP = { env: 0x0001, body: 0x0002, leg: (i) => 0x0004 << i };
const groups = (member, filter) => ((member << 16) | filter) >>> 0;

/** Punto o vector del ensamblaje (mm, Z arriba) → unidades de física (Y arriba). */
const toPhys = (x, y, z) => ({ x: x / 100, y: z / 100, z: -y / 100 });

const physics = {
  ready: false,
  R: null,
  world: null,
  body: null,
  /** Por pata: sólidos, articulaciones y datos para medir ángulos y recolocar el pie. */
  legs: [],
  /** Suelo plano, sólido fijo del entorno y sus piezas (clave → colisionador). */
  ground: null,
  envBody: null,
  env: new Map(),
  /** Ángulos pedidos y ángulos de consigna (limitados por la velocidad del servo). */
  targets: homePose(),
  command: zeroPose(),
  /** Tiempo simulado (s) y acumulador de tiempo real pendiente. */
  time: 0,
  acc: 0,

  async init() {
    const mod = await import(RAPIER_URL);
    const R = mod.default ?? mod;
    await R.init();
    this.R = R;
    this.build();
    this.ready = true;
  },

  build() {
    const R = this.R, S = PHYS.scale;
    if (this.world) this.world.free();
    const world = new R.World({ x: 0, y: -PHYS.gravity * S, z: 0 });
    world.timestep = PHYS.dt;
    world.numSolverIterations = PHYS.iterations;
    this.world = world;

    // Suelo: plano Y = 0 del sistema de colocación
    const ground = world.createRigidBody(R.RigidBodyDesc.fixed().setTranslation(0, -1, 0));
    this.ground = world.createCollider(R.ColliderDesc.cuboid(400, 1, 400)
      .setFriction(PHYS.friction.ground).setCollisionGroups(groups(GROUP.env, 0xffff)), ground);
    // Entorno real: mallas fijas en el sistema de colocación
    this.envBody = world.createRigidBody(R.RigidBodyDesc.fixed());
    this.env = new Map();

    const dynamic = (pos) => world.createRigidBody(
      R.RigidBodyDesc.dynamic().setTranslation(pos.x, pos.y, pos.z).setCanSleep(false));
    // Direcciones repartidas por la esfera (espiral de Fibonacci)
    const dirs = [];
    for (let k = 0; k < PHYS.hullDirections; k++) {
      const y = 1 - 2 * (k + 0.5) / PHYS.hullDirections, r = Math.sqrt(1 - y * y), a = k * Math.PI * (3 - Math.sqrt(5));
      dirs.push([r * Math.cos(a), y, r * Math.sin(a)]);
    }
    /**
     * Envolvente convexa simplificada de unas mallas, en el sistema local de un
     * sólido con origen `o` (mm): solo el vértice más saliente en cada dirección.
     * Pocas caras hacen la simulación mucho más rápida.
     */
    const hull = (meshes, w, o) => {
      const best = dirs.map(() => ({ d: -Infinity, q: null }));
      for (const m of meshes) {
        const a = m.geometry.attributes.position.array;
        for (let k = 0; k < a.length; k += 3) {
          const q = toPhys(w * a[k] - o.x, w * a[k + 1] - o.y, a[k + 2] - o.z);
          for (let n = 0; n < dirs.length; n++) {
            const d = q.x * dirs[n][0] + q.y * dirs[n][1] + q.z * dirs[n][2];
            if (d > best[n].d) { best[n].d = d; best[n].q = q; }
          }
        }
      }
      const pts = [];
      for (const b of best) pts.push(b.q.x, b.q.y, b.q.z);
      const desc = R.ColliderDesc.convexHull(new Float32Array(pts));
      if (!desc) throw new Error('No se pudo crear un colisionador del robot.');
      return desc;
    };
    const origin = { x: 0, y: 0, z: 0 };
    const y0 = PHYS.startHeight / 100;

    // Cuerpo
    this.body = dynamic({ x: 0, y: y0, z: 0 });
    const bodySolid = robot.solids[0];
    // Masa del cuerpo con su centro de masas explícito e inercia de caja (62 × 72 × 33 mm)
    const mb = PHYS.mass.body, [bx, by, bz] = [0.62, 0.33, 0.72]; // en unidades de física, ejes Y arriba
    const com = toPhys(...PHYS.bodyCom);
    const inertia = { x: mb * (by * by + bz * bz) / 12, y: mb * (bx * bx + bz * bz) / 12, z: mb * (bx * bx + by * by) / 12 };
    world.createCollider(hull([bodySolid.meshes[0], bodySolid.meshes[1]], 1, origin)
      .setMassProperties(mb, com, inertia, { x: 0, y: 0, z: 0, w: 1 }).setFriction(PHYS.friction.other)
      .setCollisionGroups(groups(GROUP.body, GROUP.env)), this.body);

    // Patas
    this.legs = robot.legs.map((leg, i) => {
      const sx = (i === 0 || i === 3) ? 1 : -1;   // tipo izquierdo o su imagen especular
      const w = i < 2 ? 1 : -1;                   // las traseras están giradas 180° en Z
      const H = { x: w * sx * 23, y: w * -23, z: 0 };
      const A = { x: w * sx * 47, y: w * -26, z: 7 };
      const v = { x: w * sx * 42, y: 0, z: -10 };
      const [sBracket, sLeg, , sFoot] = leg.solids;
      const others = [0, 1, 2, 3].filter((j) => j !== i).reduce((f, j) => f | GROUP.leg(j), GROUP.env);
      const g = groups(GROUP.leg(i), others);

      const pH = toPhys(H.x, H.y, H.z), pA = toPhys(A.x, A.y, A.z);
      const bracket = dynamic({ x: pH.x, y: pH.y + y0, z: pH.z });
      world.createCollider(hull([sBracket.ref], w, H)
        .setMass(PHYS.mass.bracket).setFriction(PHYS.friction.other).setCollisionGroups(g), bracket);
      const legBody = dynamic({ x: pA.x, y: pA.y + y0, z: pA.z });
      world.createCollider(hull([sLeg.ref], w, A)
        .setMass(PHYS.mass.leg).setFriction(PHYS.friction.other).setCollisionGroups(g), legBody);
      // El pie es un sólido propio: cuelga del extremo de la pata (pivote C) y el
      // paralelogramo lo mantiene siempre paralelo al soporte.
      const C = { x: A.x + v.x, y: A.y + v.y, z: A.z + v.z };
      const pC = toPhys(C.x, C.y, C.z);
      const foot = dynamic({ x: pC.x, y: pC.y + y0, z: pC.z });
      world.createCollider(hull([sFoot.ref], w, C)
        .setMass(PHYS.mass.foot).setFriction(PHYS.friction.foot).setCollisionGroups(g), foot);

      // Ejes de salida de los servos: la articulación gira (ángulo - 90)° alrededor de ellos
      const hipAxis = toPhys(0, 0, -1 * 100), legAxis = toPhys(0, w * -1 * 100, 0);
      const joint = (data, a, b, servo) => {
        const j = world.createImpulseJoint(data, a, b, true);
        j.setContactsEnabled(false);
        const [lo, hi] = SERVO_LIMITS[servo];
        j.setLimits((lo - 90) * DEG, (hi - 90) * DEG);
        j.configureMotorModel(R.MotorModel.ForceBased);
        return j;
      };
      const zero = { x: 0, y: 0, z: 0 };
      const hipJoint = joint(R.JointData.revolute(pH, zero, hipAxis), this.body, bracket, HIP_SERVO[i]);
      const dA = toPhys(A.x - H.x, A.y - H.y, A.z - H.z);
      const legJoint = joint(R.JointData.revolute(dA, zero, legAxis), bracket, legBody, LEG_SERVO[i]);
      // Paralelogramo: rótula entre pata y pie en C, y giro del pie bloqueado respecto al soporte
      const dC = toPhys(v.x, v.y, v.z);
      world.createImpulseJoint(R.JointData.spherical(dC, zero), legBody, foot, true).setContactsEnabled(false);
      const M = R.JointAxesMask;
      world.createImpulseJoint(R.JointData.generic(zero, zero, { x: 1, y: 0, z: 0 }, M.AngX | M.AngY | M.AngZ),
        bracket, foot, true).setContactsEnabled(false);

      return {
        bracket, legBody, foot, hipJoint, legJoint, hipAxis, legAxis,
        home: { bracket: pH, leg: pA, foot: pC },
      };
    });
    this.command = zeroPose();
    this.time = 0;
  },

  /**
   * Añade o sustituye una pieza del entorno: malla de triángulos fija, con los
   * vértices ya en unidades de física y en el sistema de colocación.
   */
  setEnv(key, vertices, indices) {
    this.removeEnv(key);
    if (indices.length < 3) return;
    const desc = this.R.ColliderDesc.trimesh(vertices, indices);
    if (!desc) return;
    desc.setFriction(PHYS.friction.ground).setCollisionGroups(groups(GROUP.env, 0xffff));
    this.env.set(key, this.world.createCollider(desc, this.envBody));
  },

  removeEnv(key) {
    const collider = this.env.get(key);
    if (!collider) return;
    this.world.removeCollider(collider, false);
    this.env.delete(key);
  },

  /** Quita todo el entorno y vuelve al suelo plano. */
  clearEnv() {
    for (const key of [...this.env.keys()]) this.removeEnv(key);
    this.setGround(true);
  },

  /** Activa o desactiva el suelo plano infinito del punto de colocación. */
  setGround(on) { if (this.ground.isEnabled() !== on) this.ground.setEnabled(on); },

  /** Ángulo (rad) que ha girado `child` respecto a `parent` alrededor de `axis`. */
  jointAngle(parent, child, axis) {
    const a = parent.rotation(), b = child.rotation();
    _qa.set(-a.x, -a.y, -a.z, a.w).multiply(_qb.set(b.x, b.y, b.z, b.w));
    if (_qa.w < 0) _qa.set(-_qa.x, -_qa.y, -_qa.z, -_qa.w);
    return 2 * Math.atan2(_qa.x * axis.x + _qa.y * axis.y + _qa.z * axis.z, _qa.w);
  },

  /** Ángulos de servo reales (grados), medidos en las articulaciones. */
  measured() {
    const out = Array(8);
    this.legs.forEach((leg, i) => {
      out[HIP_SERVO[i]] = 90 + this.jointAngle(this.body, leg.bracket, leg.hipAxis) / DEG;
      out[LEG_SERVO[i]] = 90 + this.jointAngle(leg.bracket, leg.legBody, leg.legAxis) / DEG;
    });
    return out;
  },

  /**
   * Fija los ángulos pedidos a los servos, recortados a sus topes mecánicos.
   * Devuelve las patas que han llegado a un tope.
   */
  setTargets(angles) {
    const stops = [];
    this.targets = angles.map((v, i) => Math.min(SERVO_LIMITS[i][1], Math.max(SERVO_LIMITS[i][0], v)));
    robot.legs.forEach((leg, i) => {
      if (this.targets[HIP_SERVO[i]] !== angles[HIP_SERVO[i]] || this.targets[LEG_SERVO[i]] !== angles[LEG_SERVO[i]]) {
        stops.push({ legs: [], solids: leg.solids, text: `la pata ${leg.name} ha llegado a su tope` });
      }
    });
    return stops;
  },

  /** Un paso de simulación de PHYS.dt segundos. */
  step() {
    // Consigna de cada servo: avanza hacia el ángulo pedido a la velocidad máxima
    // del servo y no se aleja del ángulo real más de lo que da su par máximo
    // (así el motor nunca empuja con más fuerza que un SG90 de verdad).
    const maxMove = PHYS.servoSpeed * PHYS.dt, maxError = PHYS.stallTorque / PHYS.stiffness / DEG;
    const real = this.measured();
    for (let i = 0; i < 8; i++) {
      const d = this.targets[i] - this.command[i];
      const c = this.command[i] + Math.min(maxMove, Math.max(-maxMove, d));
      this.command[i] = Math.min(real[i] + maxError, Math.max(real[i] - maxError, c));
    }
    this.legs.forEach((leg, i) => {
      leg.hipJoint.configureMotorPosition((this.command[HIP_SERVO[i]] - 90) * DEG, PHYS.stiffness, PHYS.damping);
      leg.legJoint.configureMotorPosition((this.command[LEG_SERVO[i]] - 90) * DEG, PHYS.stiffness, PHYS.damping);
    });
    this.world.step();
    this.time += PHYS.dt;
  },

  /** Avanza la simulación el tiempo real transcurrido y actualiza el modelo visible. */
  update(dt) {
    this.acc += Math.min(dt, 0.05);
    while (this.acc >= PHYS.dt) { this.step(); this.acc -= PHYS.dt; }
    this.syncVisual();
  },

  syncVisual() {
    const t = this.body.translation(), q = this.body.rotation(), S = PHYS.scale;
    robot.root.position.set(t.x / S, t.y / S, t.z / S);
    robot.root.quaternion.set(q.x, q.y, q.z, q.w);
    robot.setAngles(this.measured());
  },

  /**
   * Recoloca el robot en la postura de calibración, quieto, con el origen del
   * cuerpo a `height` metros sobre el punto (x, z) y girado `yaw` radianes.
   */
  reset(height = PHYS.startHeight / 1000, x = 0, z = 0, yaw = 0) {
    const S = PHYS.scale, zero = { x: 0, y: 0, z: 0 };
    _qa.setFromAxisAngle(_p.set(0, 1, 0), yaw);
    const rot = { x: _qa.x, y: _qa.y, z: _qa.z, w: _qa.w };
    const place = (rb, local) => {
      _q.set(local.x, local.y, local.z).applyQuaternion(_qa);
      rb.setTranslation({ x: x * S + _q.x, y: height * S + _q.y, z: z * S + _q.z }, true);
      rb.setRotation(rot, true);
      rb.setLinvel(zero, true); rb.setAngvel(zero, true);
    };
    place(this.body, zero);
    for (const leg of this.legs) { place(leg.bracket, leg.home.bracket); place(leg.legBody, leg.home.leg); place(leg.foot, leg.home.foot); }
    this.command = zeroPose();
    this.acc = 0;
    this.syncVisual();
  },

  /** Posición (m) y rumbo (rad) del cuerpo, para pruebas y para el bloque de giro. */
  pose() {
    const t = this.body.translation(), q = this.body.rotation(), S = PHYS.scale;
    // Dirección del frente del robot (+Z local) proyectada en el suelo
    _q.set(0, 0, 1).applyQuaternion(_qa.set(q.x, q.y, q.z, q.w));
    return { x: t.x / S, y: t.y / S, z: t.z / S, yaw: Math.atan2(_q.x, _q.z), up: _p.set(0, 1, 0).applyQuaternion(_qa).y };
  },

  /**
   * Simula `seconds` segundos sin esperar al reloj (para pruebas). `targetsAt(t)`
   * da los ángulos pedidos en cada instante.
   */
  simulate(seconds, targetsAt = null) {
    const n = Math.round(seconds / PHYS.dt);
    for (let k = 0; k < n; k++) {
      if (targetsAt) this.setTargets(targetsAt(k * PHYS.dt * 1000).map((v) => Math.min(180, Math.max(0, v))));
      this.step();
    }
    this.syncVisual();
  },
};

/* ==========================================================================
 * platform — capacidades del dispositivo y sesión AR mínima
 * ========================================================================== */

const platform = {
  isIOS: /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
  isQuest: /OculusBrowser|Quest/.test(navigator.userAgent),
  arSupported: false,
  /** Lo que ha concedido la sesión AR en curso. */
  caps: { domOverlay: false, planes: false, meshes: false, depth: false, hands: false, anchors: false },

  async detect() {
    if (this.isIOS && !navigator.xr && IOS_BRIDGE.variantLaunchKey) await this.loadIOSBridge();
    if (navigator.xr?.isSessionSupported) {
      try { this.arSupported = await navigator.xr.isSessionSupported('immersive-ar'); } catch { this.arSupported = false; }
    }
    return this;
  },

  /** Carga el SDK de Variant Launch: en Safari redirige a su visor, que sí trae WebXR. */
  loadIOSBridge() {
    return new Promise((resolve) => {
      const script = document.createElement('script');
      script.src = `https://launchar.app/sdk/v1?key=${encodeURIComponent(IOS_BRIDGE.variantLaunchKey)}&redirect=true`;
      script.onload = resolve; script.onerror = resolve;
      document.head.append(script);
    });
  },

  /** Opciones de la sesión AR: todo lo que no sea el hit-test es opcional. */
  sessionInit() {
    const init = {
      requiredFeatures: ['hit-test'],
      optionalFeatures: ['dom-overlay', 'local-floor', 'anchors', 'plane-detection', 'mesh-detection', 'hand-tracking'],
      domOverlay: { root: document.getElementById('overlay') },
    };
    // Oclusión por profundidad: solo en el visor, donde Three.js la aplica por sí mismo
    if (this.isQuest) {
      init.optionalFeatures.push('depth-sensing');
      init.depthSensing = { usagePreference: ['gpu-optimized'], dataFormatPreference: [] };
    }
    return init;
  },

  readCaps(session) {
    const f = session.enabledFeatures ?? [];
    const has = (name) => f.includes(name);
    this.caps = {
      domOverlay: has('dom-overlay') || !!session.domOverlayState,
      planes: has('plane-detection') || (!session.enabledFeatures && 'detectedPlanes' in XRFrame.prototype),
      meshes: has('mesh-detection'),
      depth: has('depth-sensing'),
      hands: has('hand-tracking'),
      anchors: has('anchors'),
    };
  },
};

/* ==========================================================================
 * environment — el entorno real como obstáculos y oclusión
 *
 * Cada plano o malla que detecta el dispositivo se convierte en:
 * - un colisionador fijo en la simulación (el robot choca con él), y
 * - una malla que solo escribe profundidad (tapa al robot cuando pasa por
 *   detrás); con «Ver entorno detectado» se dibuja en alambre.
 * En el suelo no hay oclusión, para que nunca tape los pies del robot.
 * ========================================================================== */

const environment = {
  /** Mallas en coordenadas del mundo AR. */
  group: new THREE.Group(),
  /** XRPlane | XRMesh | clave de prueba → pieza. */
  items: new Map(),
  occluder: new THREE.MeshBasicMaterial({ colorWrite: false, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 2 }),
  wire: new THREE.MeshBasicMaterial({ color: 0x35e0ff, wireframe: true, transparent: true, opacity: 0.55, side: THREE.DoubleSide }),
  debug: false,
  lastScan: 0,
  /** Hay que recalcular todos los colisionadores (ha cambiado la colocación). */
  stale: false,

  /** Crea o actualiza una pieza a partir de sus vértices locales, triángulos y postura en el mundo. */
  set(key, kind, positions, indices, matrix, floorLike = false) {
    let item = this.items.get(key);
    if (!item) {
      const mesh = new THREE.Mesh(new THREE.BufferGeometry(), this.occluder);
      mesh.matrixAutoUpdate = false; mesh.renderOrder = -1; mesh.frustumCulled = false;
      this.group.add(mesh);
      item = { kind, mesh, floorLike, supports: false, dirty: true };
      this.items.set(key, item);
    }
    if (positions) {
      item.mesh.geometry.dispose();
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      g.setIndex(new THREE.BufferAttribute(indices, 1));
      item.mesh.geometry = g;
      item.dirty = true;
    }
    if (matrix) {
      const e = item.mesh.matrix.elements;
      let moved = false;
      for (let k = 0; k < 16; k++) if (Math.abs(e[k] - matrix[k]) > 0.002) { moved = true; break; }
      if (moved) { item.mesh.matrix.fromArray(matrix); item.mesh.matrixWorldNeedsUpdate = true; item.dirty = true; }
    }
    item.floorLike = floorLike;
    this.style(item);
    return item;
  },

  style(item) {
    item.mesh.material = this.debug ? this.wire : this.occluder;
    // Sin oclusión en superficies horizontales (suelo, mesas) ni en mallas: ahí
    // un pequeño error de altura taparía los pies. Las mallas se ocluyen por profundidad.
    item.mesh.visible = this.debug || (item.kind === 'plane' && !item.floorLike);
  },

  setDebug(on) {
    this.debug = on;
    for (const item of this.items.values()) this.style(item);
  },

  remove(key) {
    const item = this.items.get(key);
    if (!item) return;
    this.group.remove(item.mesh); item.mesh.geometry.dispose();
    if (physics.ready) physics.removeEnv(key);
    this.items.delete(key);
  },

  clear() {
    for (const key of [...this.items.keys()]) this.remove(key);
    if (physics.ready) physics.clearEnv();
    this.info();
  },

  /** Lee los planos y mallas del fotograma AR (unas dos veces por segundo). */
  scan(frame) {
    const now = performance.now();
    if (now - this.lastScan < 400) return;
    this.lastScan = now;
    const ref = renderer.xr.getReferenceSpace();
    const seen = new Set();
    for (const plane of frame.detectedPlanes ?? []) {
      const pose = frame.getPose(plane.planeSpace, ref);
      if (!pose) continue;
      seen.add(plane);
      const known = this.items.get(plane);
      const changed = !known || known.time !== plane.lastChangedTime;
      const shape = changed ? this.planeGeometry(plane.polygon) : null;
      if (changed && !shape) continue;
      const item = this.set(plane, 'plane', shape?.positions, shape?.indices, pose.transform.matrix, plane.orientation !== 'vertical');
      item.time = plane.lastChangedTime;
    }
    for (const xrMesh of frame.detectedMeshes ?? []) {
      const pose = frame.getPose(xrMesh.meshSpace, ref);
      if (!pose) continue;
      seen.add(xrMesh);
      const known = this.items.get(xrMesh);
      const changed = !known || known.time !== xrMesh.lastChangedTime;
      const item = this.set(xrMesh, 'mesh', changed ? new Float32Array(xrMesh.vertices) : null,
        changed ? new Uint32Array(xrMesh.indices) : null, pose.transform.matrix);
      item.time = xrMesh.lastChangedTime;
    }
    for (const key of [...this.items.keys()]) if (typeof key === 'object' && !seen.has(key)) this.remove(key);
    this.sync();
  },

  /** Triangula el contorno de un plano (puntos en su propio sistema, sobre Y = 0). */
  planeGeometry(polygon) {
    const contour = [];
    for (const pt of polygon) contour.push(new THREE.Vector2(pt.x, pt.z));
    if (contour.length > 1 && contour[0].equals(contour[contour.length - 1])) contour.pop();
    if (contour.length < 3) return null;
    const faces = THREE.ShapeUtils.triangulateShape(contour, []);
    if (!faces.length) return null;
    const positions = new Float32Array(contour.length * 3);
    contour.forEach((c, k) => { positions[k * 3] = c.x; positions[k * 3 + 2] = c.y; });
    return { positions, indices: new Uint32Array(faces.flat()) };
  },

  /**
   * Lleva a la simulación las piezas que han cambiado, en el sistema de
   * colocación del robot, y decide si hace falta el suelo plano.
   */
  sync() {
    if (!physics.ready) return;
    const S = PHYS.scale;
    placement.updateMatrixWorld();
    const toPlacement = new THREE.Matrix4().copy(placement.matrixWorld).invert();
    for (const [key, item] of this.items) {
      if (!item.dirty && !this.stale) continue;
      item.dirty = false;
      _m1.multiplyMatrices(toPlacement, item.mesh.matrix);
      const src = item.mesh.geometry.attributes.position.array, idx = item.mesh.geometry.index.array;
      const out = new Float32Array(src.length);
      for (let k = 0; k < src.length; k += 3) {
        _p.set(src[k], src[k + 1], src[k + 2]).applyMatrix4(_m1);
        out[k] = _p.x * S; out[k + 1] = _p.y * S; out[k + 2] = _p.z * S;
      }
      item.supports = this.coversOrigin(out, idx);
      try { physics.setEnv(key, out, idx); } catch (e) { console.warn('Entorno: pieza descartada', e); }
    }
    this.stale = false;
    // Con malla del entorno, el robot se apoya en ella (y puede caerse de una mesa).
    // Solo con planos, se conserva el suelo plano: los planos del móvil tienen huecos.
    let supported = false, meshes = false;
    for (const item of this.items.values()) { supported ||= item.supports; meshes ||= item.kind !== 'plane'; }
    physics.setGround(!(meshes && supported));
    this.info();
  },

  /** ¿Hay un triángulo bajo el punto de colocación, a menos de 10 cm de altura? */
  coversOrigin(v, idx) {
    for (let k = 0; k < idx.length; k += 3) {
      const a = idx[k] * 3, b = idx[k + 1] * 3, c = idx[k + 2] * 3;
      const d = (v[b + 2] - v[c + 2]) * (v[a] - v[c]) + (v[c] - v[b]) * (v[a + 2] - v[c + 2]);
      if (Math.abs(d) < 1e-9) continue;
      const u = ((v[b + 2] - v[c + 2]) * -v[c] + (v[c] - v[b]) * -v[c + 2]) / d;
      const w = ((v[c + 2] - v[a + 2]) * -v[c] + (v[a] - v[c]) * -v[c + 2]) / d;
      if (u < 0 || w < 0 || u + w > 1) continue;
      const y = u * v[a + 1] + w * v[b + 1] + (1 - u - w) * v[c + 1];
      if (Math.abs(y) < 1) return true;
    }
    return false;
  },

  info() {
    const el = document.getElementById('envInfo');
    if (!ar.session && !this.items.size) { el.textContent = ''; return; }
    let planes = 0, meshes = 0;
    for (const item of this.items.values()) if (item.kind === 'plane') planes++; else meshes++;
    const c = platform.caps, yes = (v) => (v ? 'sí' : 'no');
    el.textContent = ar.session
      ? `Entorno: ${planes} planos (${yes(c.planes)}) · ${meshes} mallas (${yes(c.meshes)}) · oclusión por profundidad: ${yes(c.depth)}`
      : `Entorno de prueba: ${planes + meshes} piezas`;
  },

  /** Entorno simulado para probar sin dispositivo (?env): un muro delante y un escalón al lado. */
  demo() {
    const box = (key, w, h, d, x, y, z) => {
      const g = new THREE.BoxGeometry(w, h, d);
      this.set(key, 'mesh', new Float32Array(g.attributes.position.array), new Uint32Array(g.index.array),
        new THREE.Matrix4().makeTranslation(x, y, z).elements);
    };
    box('muro', 0.5, 0.08, 0.02, 0, 0.04, 0.3);
    box('escalón', 0.2, 0.01, 0.2, 0.25, 0.005, 0);
    this.setDebug(true);
    document.getElementById('chkEnv').checked = true;
    this.sync();
  },
};
scene.add(environment.group);

/**
 * Rótulo flotante para el visor, donde no hay panel sobre la imagen: muestra el
 * mensaje de estado y el recuento del entorno delante del usuario.
 */
const hud = {
  canvas: Object.assign(document.createElement('canvas'), { width: 1024, height: 192 }),
  text: null,
  mesh: null,
  init() {
    const map = new THREE.CanvasTexture(this.canvas);
    map.colorSpace = THREE.SRGBColorSpace;
    this.mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.48, 0.09),
      new THREE.MeshBasicMaterial({ map, transparent: true, depthTest: false }));
    this.mesh.renderOrder = 10; this.mesh.visible = false; this.mesh.frustumCulled = false;
    scene.add(this.mesh);
  },
  /** Coloca el rótulo delante de la cámara, algo por debajo de la vista, y lo redibuja si cambia el texto. */
  update() {
    const lines = [document.getElementById('status').textContent, document.getElementById('envInfo').textContent].filter(Boolean);
    const text = lines.join('\n');
    this.mesh.visible = !!text;
    if (!text) return;
    if (text !== this.text) {
      this.text = text;
      const c = this.canvas.getContext('2d'), w = this.canvas.width, h = this.canvas.height;
      c.clearRect(0, 0, w, h);
      c.fillStyle = 'rgba(16,20,26,0.82)'; c.beginPath(); c.roundRect(0, 0, w, h, 28); c.fill();
      c.fillStyle = '#f1f4f8'; c.font = '42px system-ui, sans-serif'; c.textBaseline = 'middle';
      lines.forEach((line, k) => c.fillText(line, 28, h * (k + 0.5) / lines.length, w - 56));
      this.mesh.material.map.needsUpdate = true;
    }
    const cam = renderer.xr.getCamera();
    cam.getWorldPosition(_p); cam.getWorldQuaternion(_qa);
    this.mesh.position.copy(_q.set(0, -0.2, -0.75).applyQuaternion(_qa)).add(_p);
    this.mesh.quaternion.copy(_qa);
  },
};
hud.init();

const ar = {
  session: null,
  /** Instante de inicio de la sesión y si ya se ha pedido configurar el espacio. */
  startedAt: 0,
  roomCaptureAsked: false,
  hitTestSource: null,
  placed: false,
  reticle: (() => {
    const r = new THREE.Mesh(
      new THREE.RingGeometry(0.07, 0.085, 48).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0xd8f000 }));
    r.matrixAutoUpdate = false; r.visible = false;
    scene.add(r);
    return r;
  })(),

  async start() {
    const session = await navigator.xr.requestSession('immersive-ar', platform.sessionInit());
    this.session = session;
    this.placed = false;
    this.startedAt = performance.now();
    this.roomCaptureAsked = false;
    platform.readCaps(session);
    // Sin panel sobre la imagen (visor) no hay casilla que marcar: el entorno se dibuja siempre
    if (!platform.caps.domOverlay) {
      environment.setDebug(true);
      document.getElementById('chkEnv').checked = true;
    }
    environment.clear();
    scene.background = null;
    floor.visible = false;
    placement.visible = false;
    arShadow.visible = true;
    await renderer.xr.setSession(session);
    const viewerSpace = await session.requestReferenceSpace('viewer');
    this.hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
    session.addEventListener('select', () => this.place());
    session.addEventListener('end', () => this.end());
    setStatus('Apunta al suelo o a una mesa y toca para colocar el robot.');
    ui.btnAR.textContent = 'Salir de AR';
    environment.info();
  },

  place() {
    if (!this.reticle.visible) return;
    placement.position.setFromMatrixPosition(this.reticle.matrix);
    // El robot mira hacia el usuario
    const cam = renderer.xr.getCamera().getWorldPosition(new THREE.Vector3());
    placement.rotation.set(0, Math.atan2(cam.x - placement.position.x, cam.z - placement.position.z), 0);
    placement.visible = true;
    if (physics.ready) physics.reset();
    this.placed = true;
    // El entorno se expresa respecto al punto de colocación: hay que recalcularlo
    environment.stale = true;
    environment.sync();
    setStatus('');
    // Sin panel sobre la imagen (visor): el robot echa a andar para poder probar el entorno
    if (!platform.caps.domOverlay) ui.play(MOTIONS[0]);
  },

  update(frame) {
    if (!this.hitTestSource) return;
    const hits = frame.getHitTestResults(this.hitTestSource);
    const pose = hits.length ? hits[0].getPose(renderer.xr.getReferenceSpace()) : null;
    this.reticle.visible = !!pose;
    if (pose) this.reticle.matrix.fromArray(pose.transform.matrix);
    environment.scan(frame);
    // Visor sin habitación configurada: tras unos segundos sin entorno, se pide configurarla
    if (!this.roomCaptureAsked && !environment.items.size && this.session.initiateRoomCapture
        && (platform.caps.planes || platform.caps.meshes) && performance.now() - this.startedAt > 5000) {
      this.roomCaptureAsked = true;
      this.session.initiateRoomCapture().catch((e) => console.warn('Configuración del espacio:', e));
    }
    if (!platform.caps.domOverlay) hud.update();
  },

  end() {
    this.session = null;
    this.hitTestSource = null;
    this.reticle.visible = false;
    hud.mesh.visible = false;
    environment.clear();
    scene.background = BG;
    floor.visible = true;
    arShadow.visible = false;
    placement.visible = true;
    placement.position.set(0, 0, 0);
    placement.rotation.set(0, 0, 0);
    if (physics.ready) physics.reset();
    ui.btnAR.textContent = 'Entrar en AR';
    setStatus('');
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  },
};

/* ==========================================================================
 * ui — panel de la fase 0: servos, posturas y vista previa de marchas
 * ========================================================================== */

function setStatus(text, isError = false) {
  const el = document.getElementById('status');
  el.textContent = text;
  el.classList.toggle('error', isError);
}

const ui = {
  btnAR: document.getElementById('btnAR'),
  selGait: document.getElementById('selGait'),
  sliders: [],
  outputs: [],
  chkLoop: document.getElementById('chkLoop'),
  /** Movimiento en vista previa (compilado), su definición y su instante de inicio. */
  motion: null,
  motionDef: null,
  motionStart: 0,

  init() {
    const host = document.getElementById('servos');
    SERVO_NAMES.forEach((name, i) => {
      const row = document.createElement('div'); row.className = 'servo';
      const label = document.createElement('label'); label.textContent = `${i} · ${name}`; label.htmlFor = `servo${i}`;
      const input = Object.assign(document.createElement('input'), { type: 'range', min: 0, max: 180, step: 1, id: `servo${i}` });
      const out = document.createElement('output');
      input.addEventListener('input', () => {
        this.stopGait();
        const a = robot.angles.slice(); a[i] = +input.value;
        applyAngles(a);
      });
      row.append(label, input, out); host.append(row);
      this.sliders.push(input); this.outputs.push(out);
    });
    for (const m of MOTIONS) this.selGait.add(new Option(m.label, m.id));
    this.selGait.addEventListener('change', () => {
      const def = MOTIONS.find((m) => m.id === this.selGait.value);
      if (def) this.play(def); else this.stopGait();
    });
    document.getElementById('btnStop').addEventListener('click', () => this.stopGait());
    document.getElementById('btnHome').addEventListener('click', () => { this.stopGait(); applyAngles(homePose()); });
    document.getElementById('btnReset').addEventListener('click', () => { if (physics.ready) physics.reset(); });
    document.getElementById('btnDrop').addEventListener('click', () => { if (physics.ready) physics.reset(0.3); });
    document.getElementById('chkEnv').addEventListener('change', (e) => environment.setDebug(e.target.checked));
    document.getElementById('btnZero').addEventListener('click', () => { this.stopGait(); applyAngles(zeroPose()); });
    this.btnAR.addEventListener('click', async () => {
      if (ar.session) { ar.session.end(); return; }
      try { await ar.start(); } catch (e) { setStatus(`No se pudo iniciar la AR: ${e.message}`, true); }
    });
    // Los toques en el panel no deben colocar el robot
    const panel = document.getElementById('panel'), btnPanel = document.getElementById('btnPanel');
    panel.addEventListener('beforexrselect', (e) => e.preventDefault());
    // Ocultar o mostrar el panel para dejar la pantalla libre
    btnPanel.addEventListener('click', () => {
      const hidden = panel.classList.toggle('hidden');
      const label = hidden ? 'Mostrar el panel' : 'Ocultar el panel';
      btnPanel.textContent = hidden ? '☰ Panel' : '▾';
      btnPanel.title = label;
      btnPanel.setAttribute('aria-label', label);
      btnPanel.setAttribute('aria-expanded', String(!hidden));
    });
  },

  /** Empieza un movimiento desde la postura actual. */
  play(def) {
    this.motionDef = def;
    this.motion = compileMotion(def.make(), physics.ready ? physics.targets : robot.angles);
    this.motionStart = performance.now();
  },

  stopGait() { this.motion = null; this.motionDef = null; this.selGait.value = ''; },

  /** Avanza la vista previa; se llama en cada fotograma. */
  tick() {
    if (!this.motion) return;
    const t = performance.now() - this.motionStart;
    if (t < this.motion.duration) { applyAngles(this.motion.sample(t)); return; }
    applyAngles(this.motion.end);
    if (this.motionDef.loop && this.chkLoop.checked) this.play(this.motionDef); else this.stopGait();
  },

  showCollision(hits) {
    const el = document.getElementById('collision');
    if (!hits.length) { if (el.textContent) el.textContent = ''; return; }
    const more = hits.length > 1 ? ` (y ${hits.length - 1} más)` : '';
    const text = `Bloqueado: ${hits[0].text}${more}.`;
    if (el.textContent !== text) el.textContent = text;
  },

  sync(angles) {
    angles.forEach((a, i) => {
      this.sliders[i].value = a;
      this.outputs[i].textContent = `${Math.round(a)}°`;
    });
  },
};

/**
 * Lleva el robot hacia los ángulos pedidos sin que sus piezas se atraviesen,
 * lo apoya en el suelo y actualiza el panel con la postura realmente alcanzada.
 */
function applyAngles(angles) {
  const clamped = angles.map((a) => Math.min(180, Math.max(0, a)));
  if (physics.ready) {
    // Con físicas: los ángulos son consignas para los servos; el movimiento lo resuelve la simulación
    const stops = physics.setTargets(clamped);
    robot.flag(stops);
    ui.sync(physics.targets);
    ui.showCollision(stops);
    return;
  }
  const hits = robot.moveTo(clamped);
  robot.flag(hits);
  robot.root.position.y = robot.groundHeight / 1000;
  ui.sync(robot.angles);
  ui.showCollision(hits);
}

/* ==========================================================================
 * selftest — comprobaciones con index.html?test
 * Valores esperados calculados a mano a partir de las tablas de kame.cpp.
 * ========================================================================== */

function runSelfTest() {
  const results = [];
  const check = (name, ok, detail = '') => results.push({ name, ok: !!ok, detail });
  const near = (a, b) => Math.abs(a - b) < 1e-6;
  const sameP = (a, b) => a.length === b.length && a.every((v, i) => near(v, b[i]));
  const home = homePose();
  const run = (segments, start = home) => compileMotion(segments, start);

  // Posturas
  check('home = {110, 70, 55, 125, 70, 110, 125, 55}', sameP(home, [110, 70, 55, 125, 70, 110, 125, 55]));
  check('zero = 90 en los ocho servos', sameP(zeroPose(), all(90)));

  // Oscilador
  check('oscilador: A·sin(2πt/T + φ) + offset', near(osc(15, 600, 90, 67, 0), 82) && near(osc(15, 600, 0, 105, 150), 120));

  // turnR(·, 600)
  let m = run(kame32.turnR(4, 600));
  check('turnR: duración = pasos × periodo', near(m.duration, 2400));
  check('turnR: t = 0', sameP(m.sample(0), [105, 75, 82, 128, 75, 105, 128, 82]), m.sample(0).map((v) => v.toFixed(2)).join(', '));
  check('turnR: t = T/4', sameP(m.sample(150), [120, 60, 67, 113, 60, 120, 113, 67]), m.sample(150).map((v) => v.toFixed(2)).join(', '));
  // turnL es turnR con las caderas en contrafase
  const l = run(kame32.turnL(4, 600)).sample(150);
  check('turnL: caderas en contrafase respecto a turnR', sameP([l[0], l[1], l[4], l[5]], [90, 90, 90, 90]));

  // walk(·, 1000): caderas continuas, patas por diagonales alternas
  m = run(kame32.walk(2, 1000));
  check('walk: duración = pasos × periodo', near(m.duration, 2000));
  let a = m.sample(0);
  check('walk: t = 0, caderas', sameP([a[0], a[1], a[4], a[5]], [113, 97, 43, 107]));
  check('walk: t = 0, patas 3 y 6 activas', near(a[3], 120) && near(a[6], 120));
  check('walk: t = 0, patas 2 y 7 aún sin orden (postura inicial)', near(a[2], home[2]) && near(a[7], home[7]));
  a = m.sample(600);
  const lift = 20 * Math.sin(2 * Math.PI * 600 / 500 + 270 * DEG);
  check('walk: t = 0,6 T, patas 2 y 7 activas', near(a[2], 80 + lift) && near(a[7], 80 + lift));
  check('walk: t = 0,6 T, patas 3 y 6 retenidas', near(a[3], 120) && near(a[6], 120));
  a = m.sample(1100);
  check('walk: t = 1,1 T, patas 2 y 7 retenidas en su último valor', near(a[2], 60) && near(a[7], 60));
  // backward: mismo patrón con el avance invertido
  a = run(kame32.backward(2, 1000)).sample(0);
  check('backward: t = 0, caderas', sameP([a[0], a[1], a[4], a[5]], [107, 43, 97, 113]), [a[0], a[1], a[4], a[5]].join(', '));
  // omniWalk: caderas quietas
  a = run(kame32.omniWalk(2, 1000)).sample(333);
  check('omniWalk: las caderas no oscilan', sameP([a[0], a[1], a[4], a[5]], [110, 70, 70, 110]));

  // pushUp, moonwalk
  a = run(kame32.pushUp(4, 1000)).sample(250);
  check('pushUp: t = T/4', sameP(a, [90, 90, 100, 80, 25, 155, 120, 60]), a.map((v) => v.toFixed(2)).join(', '));
  a = run(kame32.moonwalkL(2, 2000)).sample(0);
  check('moonwalkL: caderas a 90', sameP([a[0], a[1], a[4], a[5]], [90, 90, 90, 90]));

  // hello y jump: secuencias
  m = run(kame32.hello());
  check('hello: duración 150 + 200 + 4·350 + 500 + 200 ms', near(m.duration, 2450));
  check('hello: a los 150 ms está sentado', sameP(m.sample(150), SIT_POSE));
  check('hello: a los 75 ms va a medio camino', sameP(m.sample(75), home.map((v, i) => (v + SIT_POSE[i]) / 2)));
  check('hello: termina con las patas delanteras arriba', sameP(m.end, [160, 20, 90, 90, 70, 110, 100, 80]));
  m = run(kame32.jump());
  check('jump: duración 150 + 200 + 100 ms', near(m.duration, 450));
  check('jump: el impulso es instantáneo', sameP(m.sample(350), [110, 70, 55, 125, 30, 150, 125, 55]));
  check('jump: termina en home', sameP(m.end, home));

  // Todos los movimientos: dentro del recorrido de los servos y sin choques
  for (const def of MOTIONS) {
    const motion = run(def.make());
    let outOfRange = null, stop = null;
    for (let t = 0; t <= motion.duration && !stop; t += 10) {
      // El firmware recorta cada orden a 0–180° (Kame::setServo); «Saludar» lo aprovecha
      const pose = motion.sample(t).map((v) => Math.min(180, Math.max(0, v)));
      pose.forEach((v, i) => {
        if (!outOfRange && (v < SERVO_LIMITS[i][0] - 1e-6 || v > SERVO_LIMITS[i][1] + 1e-6)) {
          outOfRange = `servo ${i} pide ${v.toFixed(1)}° en t = ${t} ms (tope ${SERVO_LIMITS[i].join('–')}°)`;
        }
      });
    }
    check(`${def.label}: dentro de los topes mecánicos`, !outOfRange, outOfRange ?? '');
    robot.setAngles(home);
    for (let t = 0; t <= motion.duration && !stop; t += 20) {
      const hits = robot.moveTo(motion.sample(t).map((v) => Math.min(180, Math.max(0, v))));
      const crash = hits.find((h) => h.legs.length);
      if (crash) stop = `${crash.text} en t = ${t} ms`;
    }
    check(`${def.label}: sin choques entre patas`, !stop, stop ?? '');
  }
  // Físicas: el robot se sostiene, camina recto, gira y aguanta una caída
  if (physics.ready) {
    const deg = (rad) => rad / DEG;
    const settle = () => { physics.reset(); physics.simulate(1, () => home); };
    const play = (segments) => {
      const motion = run(segments);
      physics.simulate(motion.duration / 1000, (t) => motion.sample(t));
      physics.simulate(0.8, () => motion.end);
      return physics.pose();
    };
    settle();
    let pose = physics.pose();
    check('físicas: en reposo queda de pie y quieto', pose.up > 0.99 && Math.hypot(pose.x, pose.z) < 0.01,
      `inclinación ${deg(Math.acos(pose.up)).toFixed(1)}°`);
    const real = physics.measured();
    check('físicas: los servos alcanzan la postura pedida (±3°)', real.every((v, i) => Math.abs(v - home[i]) < 3),
      real.map((v) => v.toFixed(1)).join(', '));
    pose = play(kame32.walk(10, 500));
    check('físicas: 10 ciclos de walk avanzan hacia delante', pose.z > 0.3, `avance ${(pose.z * 1000).toFixed(0)} mm`);
    check('físicas: 10 ciclos de walk se desvían menos de 15°', Math.abs(deg(pose.yaw)) < 15 && pose.up > 0.99,
      `desvío ${deg(pose.yaw).toFixed(1)}°`);
    settle();
    pose = play(kame32.backward(10, 500));
    check('físicas: backward retrocede', pose.z < -0.3 && pose.up > 0.99, `avance ${(pose.z * 1000).toFixed(0)} mm`);
    settle();
    pose = play(kame32.turnL(4, 600));
    check('físicas: turnL gira a la izquierda sin volcar', deg(pose.yaw) > 90 && pose.up > 0.99, `giro ${deg(pose.yaw).toFixed(0)}°`);
    settle();
    pose = play(kame32.turnR(4, 600));
    check('físicas: turnR gira a la derecha sin volcar', deg(pose.yaw) < -90 && pose.up > 0.99, `giro ${deg(pose.yaw).toFixed(0)}°`);
    settle();
    pose = play(kame32.hello());
    check('físicas: hello termina de pie', pose.up > 0.95, `inclinación ${deg(Math.acos(pose.up)).toFixed(1)}°`);
    settle();
    pose = play(kame32.jump());
    check('físicas: jump salta hacia delante y cae de pie', pose.up > 0.99 && pose.z > 0.01, `avance ${(pose.z * 1000).toFixed(0)} mm`);
    // Entorno: un muro de malla delante detiene al robot; sin suelo plano, un plano lo sostiene
    const quad = (x0, x1, y0, y1, z0, z1) => new Float32Array([x0, y0, z0, x1, y0, z1, x1, y1, z1, x0, y1, z0]);
    const quadIdx = new Uint32Array([0, 1, 2, 0, 2, 3]);
    physics.setEnv('muro', quad(-3, 3, 0, 1, 2, 2), quadIdx);       // muro vertical a 20 cm
    settle();
    pose = play(kame32.walk(10, 500));
    check('entorno: un muro a 20 cm detiene el avance', pose.z > 0.03 && pose.z < 0.2 && pose.up > 0.9, `avance ${(pose.z * 1000).toFixed(0)} mm`);
    physics.removeEnv('muro');
    physics.setEnv('mesa', new Float32Array([-3, 0, -3, 3, 0, -3, 3, 0, 3, -3, 0, 3]), quadIdx); // tablero de 60 cm
    physics.setGround(false);
    settle();
    pose = physics.pose();
    check('entorno: sin suelo plano, la malla sostiene al robot', pose.up > 0.99 && pose.y > 0.03, `altura ${(pose.y * 1000).toFixed(0)} mm`);
    check('entorno: el punto de colocación está cubierto', environment.coversOrigin(new Float32Array([-3, 0, -3, 3, 0, -3, 3, 0, 3, -3, 0, 3]), quadIdx)
      && !environment.coversOrigin(quad(-3, 3, 0, 1, 2, 2), quadIdx));
    physics.clearEnv();
    check('entorno: al quitarlo vuelve el suelo plano', physics.ground.isEnabled() && physics.env.size === 0);
    physics.reset(0.3);
    physics.simulate(2, () => home);
    pose = physics.pose();
    check('físicas: caída desde 30 cm, aterriza de pie y entero', pose.up > 0.99 && physics.measured().every((v, i) => Math.abs(v - home[i]) < 3),
      `inclinación ${deg(Math.acos(Math.min(1, pose.up))).toFixed(1)}°`);
    physics.reset();
  }
  applyAngles(home);

  // Informe
  const failed = results.filter((r) => !r.ok);
  const box = document.createElement('div');
  box.id = 'tests';
  const title = document.createElement('h2');
  title.textContent = failed.length ? `Autotest: ${failed.length} de ${results.length} fallan` : `Autotest: ${results.length} comprobaciones correctas`;
  const list = document.createElement('ul');
  for (const r of results) {
    const li = document.createElement('li');
    li.className = r.ok ? 'ok' : 'fail';
    li.textContent = r.ok || !r.detail ? r.name : `${r.name} — ${r.detail}`;
    list.append(li);
  }
  box.append(title, list);
  document.getElementById('overlay').append(box);
  console[failed.length ? 'error' : 'info'](title.textContent, failed);
  window.kameTest = { results, failed };
}

/* ==========================================================================
 * main
 * ========================================================================== */

ui.init();
ui.sync(robot.angles);

let lastFrame = performance.now();
renderer.setAnimationLoop((time, frame) => {
  const now = performance.now(), dt = (now - lastFrame) / 1000;
  lastFrame = now;
  if (robot.legs.length) ui.tick();
  if (physics.ready) {
    physics.update(dt);
    // Si se cae al vacío (por el borde de una mesa sin suelo detectado), vuelve a su sitio
    if (physics.body.translation().y < -1.5 * PHYS.scale) {
      physics.reset();
      setStatus('El robot se ha caído fuera del entorno detectado; vuelve al punto de colocación.');
    }
  }
  if (frame && ar.session) ar.update(frame);
  else {
    // La cámara y la luz siguen al robot
    _p.copy(robot.root.position).setY(0.03).sub(controls.target);
    if (physics.ready && _p.lengthSq() > 1e-8) {
      _p.multiplyScalar(Math.min(1, dt * 4));
      controls.target.add(_p); camera.position.add(_p);
    }
    sun.position.copy(robot.root.position).add(SUN_OFFSET);
    sun.target.position.copy(robot.root.position);
    controls.update();
  }
  renderer.render(scene, camera);
});

let physicsNote = '';
try {
  await robot.load();
  applyAngles(homePose());
  try {
    await physics.init();
    applyAngles(homePose());
  } catch (e) {
    console.error(e);
    physicsNote = ' Sin físicas: no se pudo cargar el motor.';
  }
  await platform.detect();
  if (platform.arSupported) {
    ui.btnAR.disabled = false;
    setStatus('');
  } else if (platform.isIOS) {
    setStatus('Modo 3D. La AR en iPhone necesita el puente WebXR (falta su clave en IOS_BRIDGE).' + physicsNote);
  } else {
    setStatus('Modo 3D. Este navegador no ofrece AR (WebXR immersive-ar).' + physicsNote);
  }
  window.kame = { robot, physics, PHYS, applyAngles, kame32, MOTIONS, compileMotion, platform, environment, ar, hud }; // para depurar desde la consola
  if (new URLSearchParams(location.search).has('test')) runSelfTest();
  if (new URLSearchParams(location.search).has('env')) environment.demo();
} catch (e) {
  console.error(e);
  setStatus(`${e.message} Comprueba la conexión y recarga la página.`, true);
}
</script>
