<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { MeshBVH } from 'three-mesh-bvh';

/* ==========================================================================
 * config — constantes del proyecto
 * ========================================================================== */

/** Piezas STL del repositorio original, con el commit fijado. */
const STL_BASE = 'https://cdn.jsdelivr.net/gh/JavierIH/kame32@8f33e489f7425747ab62aeb509777a06d2f14f3e/3d/stl/';

const COLORS = { body: 0x161618, yellow: 0xdff214, black: 0x161618, servo: 0x2a78e0, horn: 0xf4f4f0, screw: 0xa9afb6 };

/** Orden de los servos del firmware (kame.cpp). */
const SERVO_NAMES = [
  'Cadera del. izq.', 'Cadera del. der.', 'Pata del. izq.', 'Pata del. der.',
  'Cadera tras. izq.', 'Cadera tras. der.', 'Pata tras. izq.', 'Pata tras. der.',
];

/** Servo de cadera y servo de pata de cada pata: del. izq., del. der., tras. izq., tras. der. */
const HIP_SERVO = [0, 1, 4, 5];
const LEG_SERVO = [2, 3, 6, 7];

const DEG = Math.PI / 180;

/** Motor de físicas, cargado de forma externa (incluye su WebAssembly). */
/**
 * Puente WebXR para iPhone (Safari no trae WebXR). Con una clave de Variant
 * Launch (launchar.app) la página se abre en su visor y la AR funciona igual
 * que en Android. Sin clave, el iPhone se queda en modo 3D.
 */
const IOS_BRIDGE = { variantLaunchKey: '' };
const RAPIER_URL = 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js';

/**
 * Topes mecánicos de la pata delantera izquierda, en grados de servo: fuera de
 * ellos la pata choca consigo misma o con el cuerpo. Medidos con
 * kame.robot.measureLegLimits() sobre las mallas reales (rejilla de 2°): la
 * zona libre resultó ser un rectángulo, así que basta un intervalo por servo.
 * Hay que volver a medirlos si cambian las piezas o el modelo de los servos.
 */
const LEG_LIMITS = { hip: [64, 180], leg: [16, 152] };

/** Intervalo permitido de cada uno de los 8 servos. Las patas del tipo derecho son la imagen especular. */
const SERVO_LIMITS = (() => {
  const out = [];
  for (let i = 0; i < 4; i++) {
    const mirror = ([lo, hi]) => (i === 1 || i === 2 ? [180 - hi, 180 - lo] : [lo, hi]);
    out[HIP_SERVO[i]] = mirror(LEG_LIMITS.hip);
    out[LEG_SERVO[i]] = mirror(LEG_LIMITS.leg);
  }
  return out;
})();

/* ==========================================================================
 * gait — port de las marchas del firmware (Octosnake y Kame)
 *
 * Un movimiento es una lista de segmentos. Cada segmento tiene una duración y
 * una función sample(t, start) que da los 8 ángulos en el instante t (ms),
 * siendo `start` la postura con la que empieza. Así cualquier movimiento se
 * puede evaluar en cualquier instante, sin temporizadores, y probarse.
 * ========================================================================== */

/** Postura de reposo del firmware (Kame::home). */
function homePose() {
  const ap = 20, hi = 35;
  return [90 + ap, 90 - ap, 90 - hi, 90 + hi, 90 - ap, 90 + ap, 90 + hi, 90 - hi];
}

/** Postura de calibración (Kame::zero). */
function zeroPose() { return Array(8).fill(90); }

/** Salida de un oscilador en el instante t, igual que Oscillator::refresh. */
function osc(amplitude, period, phaseDeg, offset, t) {
  return amplitude * Math.sin(2 * Math.PI * t / period + phaseDeg * DEG) + offset;
}

/** Tabla de una marcha con el patrón habitual del firmware: apertura (ap), altura (hi) y avance (frontX). */
function gaitTable(period, xAmp, zAmp, ap, hi, frontX, phase) {
  return {
    period,
    amplitude: [xAmp, xAmp, zAmp, zAmp, xAmp, xAmp, zAmp, zAmp],
    offset: [90 + ap - frontX, 90 - ap + frontX, 90 - hi, 90 + hi, 90 - ap - frontX, 90 + ap + frontX, 90 + hi, 90 - hi],
    phase,
  };
}
const all = (T) => Array(8).fill(T);
/** Periodos de las marchas de paso: las patas (servos 2, 3, 6, 7) oscilan al doble de frecuencia. */
const stepPeriods = (T) => [T, T, T / 2, T / 2, T, T, T / 2, T / 2];

const seg = {
  /** Kame::execute: los 8 osciladores a la vez durante `steps` periodos. */
  oscillate(table, steps) {
    const { period, amplitude, offset, phase } = table;
    return {
      duration: period[0] * steps,
      sample: (t) => period.map((T, i) => osc(amplitude[i], T, phase[i], offset[i], t)),
    };
  },
  /**
   * Bucle de Kame::walk / backward / omniWalk: las caderas oscilan siempre; en
   * cada medio periodo solo se mueve una diagonal de patas (3 y 6, luego 2 y 7)
   * y la otra conserva la última posición que recibió.
   */
  stepping(table, steps) {
    const { period, amplitude, offset, phase } = table;
    const half = period[0] / 2;
    return {
      duration: period[0] * steps,
      sample: (t, start) => {
        const window = Math.floor(t / half), side = window % 2;
        return period.map((T, i) => {
          const isHip = i === 0 || i === 1 || i === 4 || i === 5;
          const live = isHip || (side === 0 ? (i === 3 || i === 6) : (i === 2 || i === 7));
          if (live) return osc(amplitude[i], T, phase[i], offset[i], t);
          if (window === 0) return start[i]; // todavía no ha recibido ninguna orden
          return osc(amplitude[i], T, phase[i], offset[i], window * half);
        });
      },
    };
  },
  /** Kame::moveServos: interpolación lineal hasta `target` (inmediata si dura 10 ms o menos). */
  ramp(ms, target) {
    return {
      duration: ms,
      sample: (t, start) => (ms > 10 ? start.map((v, i) => v + (target[i] - v) * Math.min(1, t / ms)) : target.slice()),
    };
  },
  /** delay(): mantiene la postura. */
  hold(ms) { return { duration: ms, sample: (t, start) => start.slice() }; },
  /** Postura inmediata (home, zero). */
  pose(target) { return { duration: 0, sample: () => target.slice() }; },
};

/** Las funciones de Kame (kame.cpp) como listas de segmentos. Periodos en ms. */
const kame32 = {
  walk: (steps, T) => [seg.stepping(gaitTable(stepPeriods(T), 15, 20, 20, 10, 12, [90, 90, 270, 90, 270, 270, 90, 270]), steps)],
  backward: (steps, T) => [seg.stepping(gaitTable(stepPeriods(T), 15, 20, 20, 10, -12, [270, 270, 270, 90, 90, 90, 90, 270]), steps)],
  omniWalk: (steps, T) => [seg.stepping(gaitTable(stepPeriods(T), 0, 20, 20, 10, 0, [90, 90, 270, 90, 270, 270, 90, 270]), steps)],
  run: (steps, T) => [seg.oscillate(gaitTable(all(T), 15, 15, 15, 15, 6, [0, 0, 90, 90, 180, 180, 90, 90]), steps)],
  turnL: (steps, T) => [seg.oscillate(gaitTable(all(T), 15, 15, 15, 23, 0, [180, 0, 90, 90, 0, 180, 90, 90]), steps)],
  turnR: (steps, T) => [seg.oscillate(gaitTable(all(T), 15, 15, 15, 23, 0, [0, 180, 90, 90, 180, 0, 90, 90]), steps)],
  dance: (steps, T) => [seg.oscillate(gaitTable(all(T), 0, 40, 30, 20, 0, [0, 0, 0, 270, 0, 0, 90, 180]), steps)],
  frontBack: (steps, T) => [seg.oscillate(gaitTable(all(T), 30, 25, 20, 30, 0, [0, 180, 270, 90, 0, 180, 90, 270]), steps)],
  upDown: (steps, T) => [seg.oscillate(gaitTable(all(T), 0, 35, 20, 25, 0, [0, 0, 90, 270, 180, 180, 270, 90]), steps)],
  moonwalkL: (steps, T) => [seg.oscillate({
    period: all(T), amplitude: [0, 0, 45, 45, 0, 0, 45, 45], offset: all(90), phase: [0, 0, 0, 120, 0, 0, 180, 290],
  }, steps)],
  pushUp: (steps, T) => [seg.oscillate({
    period: all(T), amplitude: [0, 0, 40, 40, 0, 0, 0, 0],
    offset: [90, 90, 90 - 30, 90 + 30, 90 - 65, 90 + 65, 90 + 30, 90 - 30], phase: [0, 0, 0, 180, 0, 0, 0, 180],
  }, steps)],
  hello: () => [
    seg.ramp(150, SIT_POSE), seg.hold(200),
    seg.oscillate({
      period: all(350), amplitude: [0, 50, 0, 50, 0, 0, 0, 0],
      offset: [90 + 15, 40, 90 - 65, 90, 90 + 20, 90 - 20, 90 + 10, 90 - 10], phase: [0, 0, 0, 90, 0, 0, 0, 0],
    }, 4),
    seg.ramp(500, [160, 20, 90, 90, 90 - 20, 90 + 20, 90 + 10, 90 - 10]), seg.hold(200),
  ],
  jump: () => [
    seg.ramp(150, SIT_POSE), seg.hold(200),
    seg.pose([90 + 20, 90 - 20, 90 - 35, 90 + 35, 90 - 60, 90 + 60, 90 + 35, 90 - 35]), seg.hold(100),
    seg.pose(homePose()),
  ],
  home: () => [seg.pose(homePose())],
  zero: () => [seg.pose(zeroPose())],
};
/** Postura «sentado» que usan hello y jump. */
const SIT_POSE = [90 + 15, 90 - 15, 90 - 65, 90 + 65, 90 + 20, 90 - 20, 90 + 10, 90 - 10];

/**
 * Movimientos que ofrece la aplicación, con pasos y periodo por defecto.
 * `loop` indica si tiene sentido repetirlo de forma continua en la vista previa.
 */
const MOTIONS = [
  { id: 'walk', label: 'Avanzar', loop: true, make: (steps = 4, T = 500) => kame32.walk(steps, T) },
  { id: 'backward', label: 'Retroceder', loop: true, make: (steps = 4, T = 500) => kame32.backward(steps, T) },
  { id: 'turnL', label: 'Girar a la izquierda', loop: true, make: (steps = 4, T = 600) => kame32.turnL(steps, T) },
  { id: 'turnR', label: 'Girar a la derecha', loop: true, make: (steps = 4, T = 600) => kame32.turnR(steps, T) },
  { id: 'run', label: 'Correr', loop: true, make: (steps = 4, T = 500) => kame32.run(steps, T) },
  { id: 'omniWalk', label: 'Marcar el paso', loop: true, make: (steps = 4, T = 500) => kame32.omniWalk(steps, T) },
  { id: 'hello', label: 'Saludar', loop: false, make: () => kame32.hello() },
  { id: 'jump', label: 'Saltar', loop: false, make: () => kame32.jump() },
  { id: 'dance', label: 'Bailar', loop: true, make: (steps = 2, T = 1000) => kame32.dance(steps, T) },
  { id: 'pushUp', label: 'Flexiones', loop: true, make: (steps = 4, T = 1000) => kame32.pushUp(steps, T) },
  { id: 'upDown', label: 'Arriba-abajo', loop: true, make: (steps = 4, T = 1000) => kame32.upDown(steps, T) },
  { id: 'frontBack', label: 'Adelante-atrás', loop: true, make: (steps = 2, T = 1000) => kame32.frontBack(steps, T) },
  { id: 'moonwalkL', label: 'Moonwalk', loop: true, make: (steps = 2, T = 2000) => kame32.moonwalkL(steps, T) },
];

/**
 * Encadena los segmentos a partir de una postura inicial.
 * @returns {{duration:number, end:number[], sample:(t:number)=>number[]}}
 */
function compileMotion(segments, startPose) {
  let t0 = 0, pose = startPose.slice();
  const parts = segments.map((s) => {
    const part = { t0, s, start: pose };
    pose = s.sample(s.duration, pose);
    t0 += s.duration;
    return part;
  });
  return {
    duration: t0,
    end: pose,
    sample(t) {
      let part = parts[0];
      for (const q of parts) { if (q.t0 <= t) part = q; else break; }
      return part.s.sample(Math.min(Math.max(t - part.t0, 0), part.s.duration), part.start);
    },
  };
}

/* ==========================================================================
 * robot — carga de piezas y ensamblaje articulado
 *
 * Sistema de coordenadas del ensamblaje: el del FreeCAD original, en mm.
 * Z arriba, el frente del robot mira a -Y y su izquierda es +X.
 * Regla de los servos: la articulación gira (ángulo - 90)° alrededor de la
 * dirección del eje de salida del servo (regla de la mano derecha).
 * ========================================================================== */

const loader = new STLLoader();

/** @returns {Promise<THREE.BufferGeometry>} */
function loadSTL(name) {
  return loader.loadAsync(STL_BASE + name).catch(() => {
    throw new Error(`No se pudo cargar la pieza «${name}» desde el CDN.`);
  });
}

/** Copia especular respecto al plano X = 0 (para las piezas del lado derecho). */
function mirrorX(geometry) {
  const g = geometry.clone();
  const p = g.attributes.position.array;
  for (let i = 0; i < p.length; i += 9) {
    p[i] = -p[i]; p[i + 3] = -p[i + 3]; p[i + 6] = -p[i + 6];
    for (let k = 0; k < 3; k++) { // invierte el sentido del triángulo
      const tmp = p[i + 3 + k]; p[i + 3 + k] = p[i + 6 + k]; p[i + 6 + k] = tmp;
    }
  }
  g.computeVertexNormals();
  return g;
}

/**
 * Modelo simplificado de un microservo SG90 (el repositorio no trae su STL).
 * Sistema local en mm: el eje de salida es +Z y pasa por el origen, la cara
 * inferior de las aletas de fijación está en Z = 0 y el cuerpo se alarga hacia +Y.
 */
let _servoLabel = null;
function servoLabel() {
  if (!_servoLabel) {
    const map = canvasTexture(256, 166, (c, w, h) => {
      c.fillStyle = '#eef3fb'; c.fillRect(0, 0, w, h);
      c.fillStyle = '#1756b8'; c.fillRect(0, 0, w, 44);
      c.fillStyle = '#ffffff'; c.font = 'bold 28px sans-serif'; c.fillText('Micro Servo', 14, 32);
      c.fillStyle = '#1756b8'; c.font = 'bold 64px sans-serif'; c.fillText('SG90', 14, 112);
      c.font = 'bold 30px sans-serif'; c.fillText('9 g', 190, 112);
      c.fillStyle = '#44506a'; c.font = '20px sans-serif'; c.fillText('4.8 V · 1.8 kg·cm', 14, 148);
    });
    _servoLabel = new THREE.MeshStandardMaterial({ map, roughness: 0.55 });
  }
  return _servoLabel;
}

function servoModel(materials) {
  const g = new THREE.Group();
  const add = (geometry, material, x, y, z) => {
    const o = new THREE.Mesh(geometry, material);
    o.position.set(x, y, z); o.castShadow = true; o.receiveShadow = true;
    g.add(o);
  };
  const cyl = (r, h) => new THREE.CylinderGeometry(r, r, h, 24).rotateX(Math.PI / 2);
  add(new THREE.BoxGeometry(12.2, 22.5, 22.7), materials.servo, 0, 5.25, -4.55); // cuerpo
  add(new THREE.BoxGeometry(12.2, 32.2, 2.5), materials.servo, 0, 5.25, 1.25);   // aletas
  add(cyl(5.9, 4), materials.servo, 0, 0, 8.8);                                  // caja reductora
  add(cyl(2.8, 4), materials.servo, 0, 6, 8.8);
  add(cyl(2.3, 3.2), materials.horn, 0, 0, 12.4);                                // eje de salida
  // Etiqueta en los dos costados
  for (const sx of [1, -1]) {
    const tag = new THREE.Mesh(new THREE.PlaneGeometry(17, 11), servoLabel());
    tag.rotation.set(0, sx * Math.PI / 2, sx * Math.PI / 2);
    tag.position.set(sx * 6.16, 5.25, -6);
    g.add(tag);
  }
  return g;
}

/**
 * Brazo del servo (pieza blanca de un solo brazo, con sus agujeros).
 * Sistema local en mm: eje del servo en el origen, brazo hacia +X, cara de
 * apoyo en Z = 0 y grosor hacia +Z. Medidas tomadas de los huecos de los STL.
 */
const HORN = { hub: 3.6, tip: 2.3, length: 16.2, thickness: 1.8 };
let _hornGeometry = null, _hubGeometry = null;
function hornModel(materials) {
  if (!_hornGeometry) {
    const { hub: R, tip: r, length: d, thickness } = HORN;
    const phi = Math.acos((R - r) / d); // ángulo de los puntos de tangencia
    const shape = new THREE.Shape();
    shape.absarc(0, 0, R, phi, 2 * Math.PI - phi, false);
    shape.absarc(d, 0, r, -phi, phi, false);
    shape.closePath();
    const hole = (x, radius) => { const h = new THREE.Path(); h.absarc(x, 0, radius, 0, 2 * Math.PI, true); shape.holes.push(h); };
    hole(0, 1.2);
    for (let k = 0; k < 5; k++) hole(6 + k * 2.2, 0.55);
    _hornGeometry = new THREE.ExtrudeGeometry(shape, { depth: thickness, bevelEnabled: false, curveSegments: 20 });
    _hubGeometry = new THREE.CylinderGeometry(R, R, 4, 24, 1, true).rotateX(Math.PI / 2);
  }
  const g = new THREE.Group();
  g.add(new THREE.Mesh(_hornGeometry, materials.horn), new THREE.Mesh(_hubGeometry, materials.horn));
  g.traverse((o) => { o.castShadow = true; o.receiveShadow = true; });
  return g;
}

/**
 * Tornillo esquemático. Sistema local en mm: la cabeza apoya en el origen y
 * sobresale hacia +Z; la caña entra hacia -Z.
 */
function screwModel(material, length, r = 1.4, headR = 2.7, headH = 1.6) {
  const g = new THREE.Group();
  const head = new THREE.Mesh(new THREE.CylinderGeometry(headR, headR, headH, 20).rotateX(Math.PI / 2), material);
  head.position.z = headH / 2;
  const shank = new THREE.Mesh(new THREE.CylinderGeometry(r, r, length, 14).rotateX(Math.PI / 2), material);
  shank.position.z = -length / 2;
  g.add(head, shank);
  return g;
}

/** Lienzo auxiliar para las texturas dibujadas. */
function canvasTexture(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

/**
 * Plástico impreso en 3D: color liso con el relieve de las capas de impresión.
 * `axis` es la dirección de apilado de las capas en el sistema de la pieza.
 * El relieve se calcula en el sombreador y se desvanece con la distancia.
 */
function printedPlastic(color, axis, roughness = 0.48) {
  const material = new THREE.MeshStandardMaterial({ color, roughness, metalness: 0 });
  const layerAxis = new THREE.Vector3(...axis);
  material.onBeforeCompile = (shader) => {
    shader.uniforms.layerAxis = { value: layerAxis };
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nuniform vec3 layerAxis;\nvarying float vLayer;\nvarying vec3 vLayerAxis;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvLayer = dot(position, layerAxis);\nvLayerAxis = normalize(normalMatrix * layerAxis);');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying float vLayer;\nvarying vec3 vLayerAxis;')
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
        {
          float phase = vLayer * 6.2831853 / 0.3;                     // capas de 0,3 mm
          float fade = 1.0 - smoothstep(1.2, 3.0, fwidth(phase));     // sin muaré de lejos
          normal = normalize(normal + vLayerAxis * (0.3 * cos(phase) * fade));
        }`);
  };
  return material;
}

const _m1 = new THREE.Matrix4(), _m2 = new THREE.Matrix4(), _line = new THREE.Line3();
const _p = new THREE.Vector3(), _q = new THREE.Vector3();
const _qa = new THREE.Quaternion(), _qb = new THREE.Quaternion();

class KameRobot {
  constructor() {
    /** Grupo en coordenadas de Three.js (Y arriba, metros). */
    this.root = new THREE.Group();
    /** Grupo en coordenadas del ensamblaje (Z arriba, mm). */
    this.asm = new THREE.Group();
    this.asm.rotation.x = -Math.PI / 2;
    this.asm.scale.setScalar(0.001);
    this.root.add(this.asm);
    this.angles = homePose();
    /** @type {{hip:THREE.Group, legPivot:THREE.Group, linkPivot:THREE.Group, foot:THREE.Group, v:THREE.Vector3}[]} */
    this.legs = [];
    /**
     * Sólidos rígidos para las colisiones. `ref` es la malla cuyo sistema local
     * sirve de referencia al sólido; `leg` es el índice de su pata (null: cuerpo).
     * @type {{name:string, leg:number|null, ref:THREE.Mesh, meshes:THREE.Mesh[]}[]}
     */
    this.solids = [];
    /** Parejas de cada pata consigo misma y con el cuerpo (la zona de la articulación se excluye). */
    this.legPairs = [[], [], [], []];
    /** Parejas entre patas distintas. */
    this.crossPairs = [];
    this.flagged = [];
  }

  async load() {
    const [box, cover, bracket, leg, link, foot, bushing] = await Promise.all([
      'body-box.stl', 'body-cover.stl', 'bracket-left-sg90.stl',
      'leg-left-sg90.stl', 'leg-link.stl', 'foot.stl', 'bushing.stl',
    ].map(loadSTL));

    // Cada STL viene en su propio sistema; aquí se llevan todos al del ensamblaje,
    // en la posición de la pata delantera izquierda.
    const m = new THREE.Matrix4();
    box.translate(0, 0, -3.5);
    cover.applyMatrix4(m.makeRotationX(Math.PI)).translate(0, 0, 2);
    bracket.applyMatrix4(m.makeRotationX(Math.PI / 2));
    link.applyMatrix4(m.makeRotationX(Math.PI / 2)).translate(66, 8, 42);
    // La bieleta es acodada: se gira 180° en su plano para que el codo libre el soporte
    link.applyMatrix4(m.makeRotationY(Math.PI)).translate(160, 0, 50);
    foot.applyMatrix4(m.makeRotationY(-Math.PI / 2));
    for (const g of [box, cover, bracket, leg, link, foot, bushing]) g.computeVertexNormals();

    const left = { bracket, leg, link, foot };
    const right = { bracket: mirrorX(bracket), leg: mirrorX(leg), link: mirrorX(link), foot: mirrorX(foot) };

    // Materiales. Cada pieza impresa lleva las capas en la dirección en que se imprimió
    // (el eje Z de su STL), expresada aquí en el sistema del ensamblaje.
    this.materials = {
      body: printedPlastic(COLORS.body, [0, 0, 1]),
      bracket: printedPlastic(COLORS.yellow, [0, 1, 0]),
      leg: printedPlastic(COLORS.black, [0, 0, 1]),
      link: printedPlastic(COLORS.black, [0, 1, 0]),
      foot: printedPlastic(COLORS.yellow, [1, 0, 0]),
      bushingTop: printedPlastic(COLORS.yellow, [0, 0, 1]),
      bushingLeg: printedPlastic(COLORS.black, [0, 1, 0]),
      servo: new THREE.MeshPhysicalMaterial({ color: COLORS.servo, roughness: 0.18, transparent: true, opacity: 0.86, clearcoat: 0.6 }),
      horn: new THREE.MeshStandardMaterial({ color: COLORS.horn, roughness: 0.42 }),
      screw: new THREE.MeshStandardMaterial({ color: COLORS.screw, roughness: 0.3, metalness: 0.7, transparent: true, opacity: 0.6 }),
    };
    const mesh = (geometry, material) => {
      const o = new THREE.Mesh(geometry, material);
      o.castShadow = true; o.receiveShadow = true;
      return o;
    };

    // Cuerpo
    const boxMesh = mesh(box, this.materials.body), coverMesh = mesh(cover, this.materials.body);
    this.asm.add(boxMesh, coverMesh);
    this.#addEyes();
    this.#addModule(cover);
    const X = new THREE.Vector3(1, 0, 0), Yv = new THREE.Vector3(0, 1, 0), Zv = new THREE.Vector3(0, 0, 1);
    /** Coloca un tornillo con la cabeza en (x, y, z) mirando hacia `out`; `o` es el origen del grupo padre. */
    const screw = (parent, x, y, z, out, length, o = null, small = false) => {
      const sc = small ? screwModel(this.materials.screw, length, 0.9, 1.9, 1.1) : screwModel(this.materials.screw, length);
      sc.quaternion.setFromUnitVectors(Zv, out);
      sc.position.set(x, y, z); if (o) sc.position.sub(o);
      parent.add(sc);
    };
    const up = Zv, down = Zv.clone().negate(), outer = Yv.clone().negate(), inner = Yv;
    // Tornillos que unen la tapa a la caja
    for (const sx of [1, -1]) screw(this.asm, sx * 31, 0, 19.5, X.clone().multiplyScalar(sx), 6);
    const body = { name: 'el cuerpo', leg: null, ref: boxMesh, meshes: [boxMesh, coverMesh] };
    this.solids.push(body);

    // Patas. Las traseras son las delanteras del lado contrario giradas 180° en Z.
    const front = new THREE.Group();
    const back = new THREE.Group();
    back.rotation.z = Math.PI;
    this.asm.add(front, back);
    const make = (parts, sx, parent, legIndex, legName) => {
      const H = new THREE.Vector3(sx * 23, -23, 0);   // eje de la cadera
      const A = new THREE.Vector3(sx * 47, -26, 7);   // eje del servo de la pata
      const B = new THREE.Vector3(sx * 59, -26, 30);  // pivote de la bieleta
      const hip = new THREE.Group(); hip.position.copy(H);
      const bracketMesh = mesh(parts.bracket, this.materials.bracket); bracketMesh.position.copy(H).negate();
      const legPivot = new THREE.Group(); legPivot.position.copy(A).sub(H);
      const legMesh = mesh(parts.leg, this.materials.leg); legMesh.position.copy(A).negate();
      const linkPivot = new THREE.Group(); linkPivot.position.copy(B).sub(H);
      const linkMesh = mesh(parts.link, this.materials.link); linkMesh.position.copy(B).negate();
      const footGroup = new THREE.Group();
      const footMesh = mesh(parts.foot, this.materials.foot); footMesh.position.copy(H).negate();
      // v: del eje de la pata al pivote del pie (lado del paralelogramo)
      const v = new THREE.Vector3(sx * 42, 0, -10);
      // Servo de la cadera: fijo al cuerpo, eje hacia abajo, aletas sobre el fondo de la caja
      const hipServo = servoModel(this.materials);
      hipServo.rotation.y = Math.PI; hipServo.position.set(H.x, H.y, 7);
      // Servo de la pata: fijo al soporte, eje hacia -Y, aletas por fuera del soporte
      const legServo = servoModel(this.materials);
      legServo.rotation.x = Math.PI / 2; legServo.position.set(A.x, -36, A.z).sub(H);
      // Brazos de los servos, encajados en los huecos que traen las piezas:
      // el de la pata (hueco de 2 mm en su cara exterior, Y = -51) y el de la
      // cadera (hueco en la base del soporte, Z = -9).
      const basis = (x, z) => new THREE.Matrix4().makeBasis(x.normalize(), z.clone().cross(x).normalize(), z);
      const legHorn = hornModel(this.materials);
      legHorn.applyMatrix4(basis(new THREE.Vector3(sx * 14.45, 0, -7.3), outer));
      legHorn.position.set(0, -49 - A.y, 0);
      const hipHorn = hornModel(this.materials);
      hipHorn.applyMatrix4(basis(new THREE.Vector3(sx * 15, -6.2, 0), down));
      hipHorn.position.set(0, 0, -7);
      // Casquillos: en lo alto del soporte (giro de la cadera) y en la cara interior de la pata
      const topBushing = mesh(bushing, this.materials.bushingTop);
      topBushing.rotation.x = Math.PI; topBushing.position.set(0, 0, 34);
      const legBushing = mesh(bushing, this.materials.bushingLeg);
      legBushing.rotation.x = Math.PI / 2; legBushing.position.set(0, -9.5 - A.y, 0);
      // Tornillos: giro de la cadera, eje interior de la pata, bieleta, pie, brazos y fijación del servo
      const C = A.clone().add(v), D = B.clone().add(v);
      screw(hip, H.x, H.y, 34, up, 12, H);
      screw(hip, A.x, -9.5, A.z, inner, 7, H);
      screw(hip, B.x, -38, B.z, outer, 24, H);
      screw(footGroup, C.x, -38, C.z, outer, 24, H);
      screw(footGroup, D.x, -38, D.z, outer, 24, H);
      screw(legPivot, A.x, -51, A.z, outer, 6, A, true);
      screw(hip, H.x, H.y, -9, down, 6, H, true);
      screw(hip, A.x, -38.5, -1.5, outer, 9, H, true);
      screw(hip, A.x, -38.5, 26.5, outer, 9, H, true);
      legPivot.add(legMesh, legHorn, legBushing); linkPivot.add(linkMesh); footGroup.add(footMesh);
      hip.add(bracketMesh, legServo, legPivot, linkPivot, footGroup, hipHorn, topBushing);
      parent.add(hip, hipServo);

      // Sólidos de la pata y parejas que pueden chocar. En las parejas unidas por
      // una articulación se ignora el contacto junto al eje, que es el propio encaje.
      body.meshes.push(...hipServo.children);
      const solid = (name, ref, extra = []) => {
        const s = { name: `${name} ${legName}`, leg: legIndex, ref, meshes: [ref, ...extra] };
        this.solids.push(s);
        return s;
      };
      const sBracket = solid('el soporte', bracketMesh, legServo.children);
      const sLeg = solid('la pata', legMesh);
      const sLink = solid('la bieleta', linkMesh);
      const sFoot = solid('el pie', footMesh);
      const Z = new THREE.Vector3(0, 0, 1), Y = new THREE.Vector3(0, 1, 0);
      const joint = (point, dir, r) => ({ point: point.clone(), dir, r });
      this.legPairs[legIndex].push(
        { a: sBracket, b: body, joint: joint(H, Z, 9) },
        { a: sLeg, b: body }, { a: sLink, b: body }, { a: sFoot, b: body },
        { a: sBracket, b: sLeg, joint: joint(A, Y, 9) },
        { a: sBracket, b: sLink, joint: joint(B, Y, 6.5) },
        { a: sBracket, b: sFoot },
        { a: sLeg, b: sLink },
        { a: sLeg, b: sFoot, joint: joint(A.clone().add(v), Y, 6.5) },
        { a: sLink, b: sFoot, joint: joint(B.clone().add(v), Y, 6.5) },
      );
      return { hip, legPivot, linkPivot, foot: footGroup, v, name: legName, solids: [sBracket, sLeg, sLink, sFoot] };
    };
    const FL = make(left, 1, front, 0, 'delantera izquierda'), FR = make(right, -1, front, 1, 'delantera derecha');
    const BL = make(right, -1, back, 2, 'trasera izquierda'), BR = make(left, 1, back, 3, 'trasera derecha');
    /** Índice de servo → pata, como en el firmware: [cadera, pata] */
    this.legs = [FL, FR, BL, BR];
    // Cada pata contra las demás
    for (let i = 0; i < 4; i++) for (let j = i + 1; j < 4; j++)
      for (const a of this.legs[i].solids) for (const b of this.legs[j].solids) this.crossPairs.push({ a, b });
    // Árbol de volúmenes (BVH) de cada geometría, para cruzar triángulos con rapidez
    for (const s of this.solids) for (const m of s.meshes) {
      if (!m.geometry.boundsTree) m.geometry.boundsTree = new MeshBVH(m.geometry);
      if (!m.geometry.boundingSphere) m.geometry.computeBoundingSphere();
    }
    this.setAngles(this.angles);
  }

  /**
   * Parejas, de entre las dadas, cuyos sólidos se atraviesan en la postura actual.
   * Comprobación exacta: compara las mallas reales triángulo a triángulo.
   */
  exactHits(pairs) {
    this.root.updateWorldMatrix(true, true);
    for (const s of this.solids) for (const m of s.meshes) {
      (m.userData.sphere ??= new THREE.Sphere()).copy(m.geometry.boundingSphere).applyMatrix4(m.matrixWorld);
    }
    return pairs.filter((pair) => this.#pairHits(pair));
  }

  /**
   * Choques entre patas distintas en la postura actual (comprobación exacta).
   * Los de cada pata consigo misma y con el cuerpo los evitan los topes de SERVO_LIMITS.
   * @returns {{legs:number[], solids:object[], text:string}[]}
   */
  collide() {
    return this.exactHits(this.crossPairs).map(({ a, b }) => (
      { legs: [a.leg, b.leg], solids: [a, b], text: `${a.name} choca con ${b.name}` }));
  }

  /**
   * Mide los topes de la pata delantera izquierda con la comprobación exacta:
   * para cada ángulo de cadera, los intervalos de ángulo de pata sin choques.
   * Tarda uno o dos minutos. Devuelve tramos de cadera con los mismos intervalos.
   */
  async measureLegLimits(step = 2, onProgress = () => {}) {
    const saved = this.angles.slice(), n = 180 / step + 1, a = zeroPose(), groups = [];
    for (let hi = 0; hi < n; hi++) {
      const runs = [];
      let start = -1;
      for (let li = 0; li <= n; li++) {
        let free = false;
        if (li < n) {
          a[HIP_SERVO[0]] = hi * step; a[LEG_SERVO[0]] = li * step;
          this.setAngles(a);
          free = this.exactHits(this.legPairs[0]).length === 0;
        }
        if (free && start < 0) start = li;
        if (!free && start >= 0) { runs.push([start * step, (li - 1) * step]); start = -1; }
      }
      const key = JSON.stringify(runs), last = groups[groups.length - 1];
      if (last && last.key === key) last.hipTo = hi * step;
      else groups.push({ hipFrom: hi * step, hipTo: hi * step, leg: runs, key });
      onProgress((hi + 1) / n);
      await new Promise((resolve) => setTimeout(resolve));
    }
    this.setAngles(saved);
    return groups.map(({ key, ...g }) => g);
  }

  #pairHits({ a, b, joint }) {
    const toA = _m1, toRef = _m2, line = _line, p = _p, q = _q;
    for (const ma of a.meshes) for (const mb of b.meshes) {
      if (!ma.userData.sphere.intersectsSphere(mb.userData.sphere)) continue;
      toA.copy(ma.matrixWorld).invert().multiply(mb.matrixWorld);
      if (joint) toRef.copy(a.ref.matrixWorld).invert().multiply(ma.matrixWorld);
      let hit = false;
      ma.geometry.boundsTree.bvhcast(mb.geometry.boundsTree, toA, {
        intersectsTriangles: (t1, t2) => {
          line.start.set(0, 0, 0); line.end.set(0, 0, 0);
          if (!t1.intersectsTriangle(t2, line, true)) return false;
          if (joint) {
            // Punto de contacto en el sistema del sólido `a`; distancia al eje de la articulación
            if (line.start.lengthSq() === 0 && line.end.lengthSq() === 0) t1.getMidpoint(p); else line.getCenter(p);
            p.applyMatrix4(toRef).sub(joint.point);
            q.copy(joint.dir).multiplyScalar(p.dot(joint.dir));
            if (p.sub(q).length() < joint.r) return false;
          }
          hit = true;
          return true;
        },
      });
      if (hit) return true;
    }
    return false;
  }

  /**
   * Mueve los servos hacia `target` tratando las piezas como sólidos:
   * 1. Cada servo se detiene en su tope mecánico (la pata no atraviesa el cuerpo ni a sí misma).
   * 2. Si dos patas fueran a chocar entre sí, se detienen justo antes del contacto
   *    y las demás siguen.
   * Devuelve lo que ha impedido alcanzar la postura pedida.
   */
  moveTo(target) {
    const from = this.angles.slice();
    const goal = target.map((v, i) => Math.min(SERVO_LIMITS[i][1], Math.max(SERVO_LIMITS[i][0], v)));
    const stops = [];
    this.legs.forEach((leg, i) => {
      if (goal[HIP_SERVO[i]] !== target[HIP_SERVO[i]] || goal[LEG_SERVO[i]] !== target[LEG_SERVO[i]]) {
        stops.push({ legs: [], solids: leg.solids, text: `la pata ${leg.name} ha llegado a su tope` });
      }
    });
    this.setAngles(goal);
    const hits = this.collide();
    if (!hits.length) return stops;
    const held = new Set();
    for (const hit of hits) for (const i of hit.legs) { held.add(HIP_SERVO[i]); held.add(LEG_SERVO[i]); }
    const mix = (t) => goal.map((v, i) => (held.has(i) ? from[i] + (v - from[i]) * t : v));
    this.setAngles(mix(0));
    if (this.collide().length) {
      // Ni reteniendo esas patas se evita el choque: no se mueve ninguna
      this.setAngles(from);
      if (this.collide().length) this.setAngles(goal); // la postura de partida ya chocaba: no bloquear
      return [...hits, ...stops];
    }
    let lo = 0, hi = 1;
    for (let k = 0; k < 6; k++) {
      const mid = (lo + hi) / 2;
      this.setAngles(mix(mid));
      if (this.collide().length) hi = mid; else lo = mid;
    }
    this.setAngles(mix(lo));
    return [...hits, ...stops];
  }

  /** Resalta en rojo los sólidos de los choques dados (ninguno: quita el resalte). */
  flag(hits) {
    for (const m of this.flagged) m.material = m.userData.baseMaterial;
    this.flagged = [];
    for (const hit of hits) for (const s of hit.solids) for (const m of s.meshes) {
      if (this.flagged.includes(m)) continue;
      const base = (m.userData.baseMaterial ??= m.material);
      if (!base.userData.hitMaterial) {
        base.userData.hitMaterial = base.clone();
        base.userData.hitMaterial.emissive = new THREE.Color(0xff2a2a);
        base.userData.hitMaterial.emissiveIntensity = 0.55;
      }
      m.material = base.userData.hitMaterial;
      this.flagged.push(m);
    }
  }

  /** Ojos saltones: base blanca, pupila negra suelta y cúpula transparente. */
  #addEyes() {
    const white = new THREE.MeshStandardMaterial({ color: 0xf6f6f2, roughness: 0.5 });
    const black = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.25 });
    const dome = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.03, transparent: true, opacity: 0.22, clearcoat: 1 });
    const disc = (r, h) => new THREE.CylinderGeometry(r, r, h, 32); // eje Y: mira al frente (-Y)
    for (const x of [-9, 9]) {
      const base = new THREE.Mesh(disc(7.5, 0.8), white); base.position.set(x, -36.4, 12.5);
      const pupil = new THREE.Mesh(disc(4.4, 0.6), black); pupil.position.set(x - Math.sign(x) * 0.8, -37.1, 11.2);
      const cover = new THREE.Mesh(new THREE.SphereGeometry(7.2, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), dome);
      cover.scale.y = 0.5; cover.rotation.x = Math.PI; cover.position.set(x, -36.8, 12.5);
      base.castShadow = true;
      this.asm.add(base, pupil, cover);
    }
  }

  /** Módulo de radio (blindaje metálico con su inscripción), visible por la ventana de la tapa (X ±9, Y -8…16). */
  #addModule(cover) {
    cover.computeBoundingBox();
    const top = cover.boundingBox.max.z;
    const label = canvasTexture(256, 256, (c, w, h) => {
      c.fillStyle = '#b9bcc0'; c.fillRect(0, 0, w, h);
      for (let k = 0; k < 900; k++) { // textura de metal cepillado
        c.fillStyle = k % 2 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
        c.fillRect(Math.random() * w, Math.random() * h, 30 + Math.random() * 60, 1);
      }
      c.strokeStyle = 'rgba(0,0,0,0.35)'; c.lineWidth = 3; c.strokeRect(8, 8, w - 16, h - 16);
      c.fillStyle = 'rgba(30,32,36,0.8)'; c.font = 'bold 30px sans-serif'; c.fillText('ESP32', 26, 70);
      c.font = '17px sans-serif'; c.fillText('WROOM-32', 26, 98);
      c.fillRect(26, 120, 70, 70);                                   // código de matriz
      c.fillStyle = '#b9bcc0';
      for (let a = 0; a < 7; a++) for (let b = 0; b < 7; b++) if ((a * 7 + b * 3 + a * b) % 3 === 0) c.fillRect(31 + a * 9, 125 + b * 9, 7, 7);
      c.fillStyle = 'rgba(30,32,36,0.8)'; c.font = '13px sans-serif';
      c.fillText('2.4 GHz', 116, 140); c.fillText('Wi-Fi · BT', 116, 160);
    });
    const metal = new THREE.MeshStandardMaterial({ color: 0xc4c7cb, roughness: 0.32, metalness: 0.9 });
    const face = new THREE.MeshStandardMaterial({ map: label, roughness: 0.38, metalness: 0.75 });
    const pcb = new THREE.MeshStandardMaterial({ color: 0x15171a, roughness: 0.6 });
    const board = new THREE.Mesh(new THREE.BoxGeometry(17.6, 23.6, 0.8), pcb);
    board.position.set(0, 4, top - 3.4);
    // Caras de la caja: ±X, ±Y, +Z (arriba, con la inscripción), -Z
    const shield = new THREE.Mesh(new THREE.BoxGeometry(15.8, 17.6, 2.4), [metal, metal, metal, metal, face, metal]);
    shield.position.set(0, 1.4, top - 1.8);
    shield.castShadow = true;
    this.asm.add(board, shield);
  }

  /**
   * Aplica los 8 ángulos de servo (grados, 0–180) al modelo.
   * Devuelve la altura (mm) a la que queda el origen del cuerpo sobre el suelo.
   */
  setAngles(angles) {
    this.angles = angles.slice();
    const hipIdx = HIP_SERVO, legIdx = LEG_SERVO;
    const yAxis = new THREE.Vector3(0, 1, 0), p = new THREE.Vector3();
    let lowest = Infinity;
    this.legs.forEach((leg, i) => {
      // Cadera: eje de salida hacia abajo (-Z)
      leg.hip.rotation.z = -(angles[hipIdx[i]] - 90) * DEG;
      // Pata: eje de salida hacia -Y en el sistema local de la pata
      const rotY = -(angles[legIdx[i]] - 90) * DEG;
      leg.legPivot.rotation.y = rotY;
      leg.linkPivot.rotation.y = rotY;
      // El pie se traslada sin girar: es el lado opuesto del paralelogramo
      p.copy(leg.v).applyAxisAngle(yAxis, rotY).sub(leg.v);
      leg.foot.position.copy(p);
      lowest = Math.min(lowest, -20 + p.z); // -20: base del pie en la postura neutra
    });
    this.groundHeight = -lowest;
    return this.groundHeight;
  }
}
